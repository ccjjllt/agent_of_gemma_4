# Multi-task clipped GRPO. GPU capacity and competition CT effects are not yet measured.
[policy]
model_name = "google/gemma-4-31B-it-qat-q4_0-unquantized"
# Record the version actually obtained manually; this declaration is not a weight-integrity proof.
model_revision = "1e4d8beecacb8b7590c1d8bedd7335f687bf311f"
model_source_uri = "https://huggingface.co/google/gemma-4-31B-it-qat-q4_0-unquantized/tree/1e4d8beecacb8b7590c1d8bedd7335f687bf311f"
# Match the public official CT wheelhouse 31 parser; keep tokenizer/template unchanged.
response_parser = "official_vllm_gemma4_0_19_1"
max_context = 32768
device_map = "balanced"
lora_rank = 128
# Ordinary LoRA keeps alpha/r = 2; this does not fix the effective update size.
lora_alpha = 256
lora_dropout = 0.0
# Export a BF16 adapter copy for submission; full recovery retains training dtype.
adapter_export_dtype = "bfloat16"
logprob_chunk_size = 64
seed = 3407

[run]
num_generations = 8
groups_per_batch = 4
max_batches = 32
max_candidate_groups_per_batch = 12
learning_rate = 0.000005
max_grad_norm = 1.0
# Initial run allowance, including model loading; --resume does not renew it.
# Only --additional-walltime-seconds explicitly extends an existing allowance.
walltime_seconds = 7200
# Keep CPU setup/tools/verification overlapped with four GPU generation slots.
max_cpu_workers = 8
prefetch_groups = 2
# One extra attempt per failed infrastructure slot; failed official tests are not retried.
max_worker_retries = 1
# Stop new selection after this many exhausted groups in one collection session.
# Drain/update valid groups; if batches remain, save the next batch and pause (exit 75).
max_failed_groups_per_session = 3

[generation]
max_batch_size = 4
# Reserve complete original context budgets; never truncate to fit a batch.
max_batch_tokens = 131072
batch_wait_ms = 5
prefill_chunk_tokens = 512
max_prefill_tokens_per_step = 1024
kv_capacity_increment = 256
# Chronological mirrored sliding KV views; no per-token whole-window cat.
sliding_cache_enabled = true
prefix_cache_entries = 8
# One prompt per rollout; shared prompts occupy one snapshot. Limit each GPU
# after reserving active/rebuild KV, gradient/Adam headroom and workspace.
prefix_cache_memory_fraction = 0.15
prefix_cache_safety_bytes = 2147483648
# Optional additional total-byte cap; 0 disables caching. Omit for auto sizing.
# prefix_cache_bytes = 2147483648

[generation.profiling]
enabled = false
wait_steps = 16
warmup_steps = 2
active_steps = 8
repeat = 1

[data]
# Empty task_ids means all mounted official public tasks except exclusions.
task_ids = []
exclude_task_ids = []

[grpo]
num_iterations = 2
epsilon = 0.2
epsilon_high = 0.28
beta = 0.01
loss_type = "dr_grpo"
max_completion_length = 32768
# Point rewards use population std; partial rewards use a monotone std upper
# bound. Keep group as baseline; compare none as a separate single-factor run.
scale_rewards = "group"
# Do not amplify tiny efficiency differences to unit-sized advantages.
advantage_std_floor = 0.05
importance_sampling_cap = 2.0
# One frozen token TIS measure for policy loss, reference KL and reuse drift.
# Capping is biased; prefixes stay behavior-distributed (not trajectory KL).
probability_correction_version = "decoupled_token_tis_v1"
# Stop on mean w*K3(log(current/old)); a partial-sum/full-token-count lower
# bound can stop remaining calls before backward. Never stops task verification.
target_kl = 0.05
# Bounded post-update probability evidence on unchanged saved full-prefix calls.
# This is a sampled KL diagnostic, not official repair evaluation or a launch gate.
post_update_kl_max_calls = 4
# Exact complete-call CPU probabilities only; never store detached prefix/KV.
reference_cache_max_entries = 128
reference_cache_max_tokens = 1000000
# Used only when the policy proves ordinary zero-LoRA / reference identity.
share_zero_reference = true
warmup_ratio = 0.1
# Prepare a positive LR for the first real update; shared by reuse comparisons.
lr_schedule_version = "positive_warmup_linear_v1"
lr_scheduler_type = "linear"
# Share only identical token paths in bounded native-SDPA training trees.
# Original per-call losses remain separate; the shared graph is backpropagated once.
training_prefix_reuse = "tree"
training_prefix_version = "exact_token_tree_v1"
training_prefix_max_calls = 4
training_prefix_max_tokens = 32768
# Two final additive masks per group/device; not the full activation-memory budget.
training_prefix_mask_bytes = 536870912
training_prefix_min_tokens = 256

[curriculum]
# Probability mass: all-task uniform 20%, unseen coverage 30%, observed priority 50%.
uniform_mix = 0.2
coverage_mix = 0.3
ema_decay = 0.8
min_group_std = 0.0001
variance_scale = 0.05
variance_weight = 1.0
success_weight = 1.0
novelty_weight = 0.2
priority_floor = 0.05
repo_repeat_penalty = 0.5

[rewards]
resolved_weight = 1.0
repair_weight = 0.3
regression_weight = 0.5
efficiency_weight = 0.02
repetition_weight = 0.0
success_token_budget = 65536

[runtime]
python = "/opt/gemma-runtime/bin/python"
sandbox_baseline_python = "/opt/gemma-sandbox-baseline/bin/python"
sandbox = "subprocess"
# Keep rollout scratch on the data disk. Its parents need traverse permission;
# official assets, credentials and judge results must remain private (0700).
sandbox_root = "/root/autodl-tmp/gemma4/sandboxes"
port = 0
# Training-only clock: exclude confirmed GPU queue wait, record wall time too.
session_clock = "queue_excluded"
# Keep competition-host behavior by default. tool_aware is an explicit local
# summarizer repair experiment; submission YAML cannot install that host code.
# 2026-11-02: user deferred this repair; keep official for training/evaluation.
event_summarizer = "official"
queue_timing_poll_seconds = 0.2

[runtime.evaluation]
# Explicit participant budgets; preserve the starter's 50-turn cap.
timeout_seconds = 300
verification_timeout_seconds = 300
max_tool_calls = 100
max_time_minutes = 60.0
max_turns = 50

[sampling]
# Deliberate unfiltered baseline, so the score-function gradient matches sampling.
# These are not the model card's top_p=.95/top_k=64 defaults.
temperature = 1.0
top_p = 1.0
top_k = 0
