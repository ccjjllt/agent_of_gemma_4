# Multi-task clipped GRPO. GPU capacity and competition CT effects are not yet measured.
[policy]
model_name = "google/gemma-4-31B-it-qat-q4_0-unquantized"
# Record the version actually obtained manually; this declaration is not a weight-integrity proof.
model_revision = "1e4d8beecacb8b7590c1d8bedd7335f687bf311f"
max_context = 32768
device_map = "balanced"
lora_rank = 32
lora_alpha = 64
lora_dropout = 0.0
logprob_chunk_size = 64
seed = 3407

[run]
num_generations = 8
groups_per_batch = 4
max_batches = 32
max_candidate_groups_per_batch = 12
learning_rate = 0.000005
max_grad_norm = 1.0
# Explicit execution cap; larger training plans still obey this cap.
walltime_seconds = 7200
max_cpu_workers = 4
prefetch_groups = 2

[generation]
max_batch_size = 4
# Reserve complete original context budgets; never truncate to fit a batch.
max_batch_tokens = 131072
batch_wait_ms = 5
prefix_cache_entries = 8
prefix_cache_bytes = 2147483648

[generation.profiling]
enabled = false
wait_steps = 16
warmup_steps = 2
active_steps = 8
repeat = 1

[data]
# Empty task_ids means all mounted official public tasks except exclusions.
task_ids = []
exclude_task_ids = []

[grpo]
num_iterations = 2
epsilon = 0.2
epsilon_high = 0.28
beta = 0.01
loss_type = "dr_grpo"
max_completion_length = 32768
scale_rewards = "group"
# Do not amplify tiny efficiency differences to unit-sized advantages.
advantage_std_floor = 0.05
importance_sampling_cap = 2.0
# Optional stop of remaining optimizer reuse; never stops task verification.
target_kl = 0.05
# Exact complete-call CPU probabilities only; never store detached prefix/KV.
reference_cache_max_entries = 128
reference_cache_max_tokens = 1000000
# Used only when the policy proves ordinary zero-LoRA / reference identity.
share_zero_reference = true
warmup_ratio = 0.1

[curriculum]
# Probability mass: all-task uniform 20%, unseen coverage 30%, observed priority 50%.
uniform_mix = 0.2
coverage_mix = 0.3
ema_decay = 0.8
min_group_std = 0.0001
variance_scale = 0.05
variance_weight = 1.0
success_weight = 1.0
novelty_weight = 0.2
priority_floor = 0.05
repo_repeat_penalty = 0.5

[rewards]
resolved_weight = 1.0
repair_weight = 0.3
regression_weight = 0.5
efficiency_weight = 0.02
repetition_weight = 0.0
success_token_budget = 65536

[runtime]
python = "/opt/gemma-runtime/bin/python"
sandbox = "subprocess"
port = 0

[runtime.evaluation]
# Explicit participant budgets; preserve the starter's 50-turn cap.
timeout_seconds = 300
verification_timeout_seconds = 300
max_tool_calls = 100
max_time_minutes = 60.0
max_turns = 50

[sampling]
# Deliberate unfiltered baseline, so the score-function gradient matches sampling.
# These are not the model card's top_p=.95/top_k=64 defaults.
temperature = 1.0
top_p = 1.0
top_k = 0
