# Five-step SPO run (2026-11-17). Fresh run under the current judge identity
# (new dependency environment): no trajectory, baseline cache or adapter from
# the 2026-11-16 run is reused. Fixed six-task public pool, every task had a
# real v0 verdict in that run (requests_7205 P=1.0; the other five P=0.0), so
# every step draws from the same pool and the step-3 and step-5 adapters are
# compared on the same tasks. This is an in-sample comparison only: those
# tasks are also trained on, so it is not an independent generalization result.
# v3 reward (official_differential_spo_v3); 16K action-token target; 5-step
# cumulative optimizer/LR plan. The external supervisor owns a 21600 s (6 h)
# hard budget including vLLM load, so walltime_seconds stops the run first.
# LoRA is rank 64 / alpha 128 (same 2:1 ratio as the rank-128 configs) for
# disk, not for quality: /root/autodl-tmp is 50 GB with ~21 GB official data
# and ~11 GB runtimes that cannot move. At rank 128 the trainer checkpoint is
# 10.8 GiB and the atomic rewrite needs a same-size temporary, so one rewrite
# peaks at ~21.6 GiB before adapters; rank 64 halves checkpoint (~5.4 GiB) and
# adapter (~0.9 GiB), so the 5-step worst case is ~16.2 GiB with all five
# adapters retained (~13.5 GiB once only the step-3/step-5 pair is kept)
# against the ~16-20 GB freed by pruning the finished 2026-11-17 run's
# checkpoint and staging copies. Consequence: this run is NOT
# capacity-comparable with the rank-128 v1 adapter from the single-step run;
# the comparison of interest is the within-run step-3 versus step-5 trend on
# the same six tasks.
algorithm = "single_stream_spo"

[policy]
model_name = "google/gemma-4-31B-it-qat-q4_0-unquantized"
model_path = "/autodl-fs/data"
model_revision = "1e4d8beecacb8b7590c1d8bedd7335f687bf311f"
model_source_uri = "https://huggingface.co/google/gemma-4-31B-it-qat-q4_0-unquantized/tree/1e4d8beecacb8b7590c1d8bedd7335f687bf311f"
response_parser = "official_vllm_gemma4_0_19_1"
lora_rank = 64
lora_alpha = 128
lora_dropout = 0.0
adapter_export_dtype = "bfloat16"
max_context = 32768
device_map = "balanced"
# 64 is the memory-safe default. Profile 64/128/256 on A800 before raising;
# _public_stats records the actual value used.
logprob_chunk_size = 64
seed = 3407

[run]
max_batches = 5
walltime_seconds = 20400
update_reserve_seconds = 840
# Same guard as the main config: a 31B optimizer step plus export/commit
# needs ~29 minutes, so a batch is deferred rather than started at the edge.
update_min_seconds = 1800
# After the first SIGTERM during an optimizer step, hard-exit with code 75
# once this grace expires; a repeated SIGTERM exits immediately. The external
# session supervisor still owns the hard deadline.
sigterm_grace_seconds = 60
max_cpu_workers = 8
max_worker_retries = 1

[inference]
engine = "vllm"
base_url = "http://127.0.0.1:8000"
# The server must be launched with --served-model-name equal to this value.
served_model_name = "google/gemma-4-31B-it-qat-q4_0-unquantized"
# Maximum concurrent whole-completion requests; vLLM batches natively, so
# this is an in-flight cap, not a decode batch size.
max_inflight = 16
# Whole-completion HTTP wait; 16K-token rollouts take far longer than the
# 30-second health/control default. This is a client timeout, not a token cap.
generation_timeout_seconds = 1800
# Deployment contract (server side): vLLM OpenAI server serving
# policy.model_path with tensor_parallel_size 2, dynamic LoRA enabled
# (VLLM_ALLOW_RUNTIME_LORA_UPDATING=True), at least two LoRA slots with
# --max-lora-rank 128, and Level-2 sleep enabled
# (VLLM_SERVER_DEV_MODE=1 --enable-sleep-mode).
# run_spo verifies /server_info, /v1/models and the sleep endpoints before any
# rollout. The server launch command lives in training/README.md.
tensor_parallel_size = 2
colocated = true
# Prefix caching is required for the agent loop: without it every turn
# re-prefills the whole conversation (~27 s/call on 2xA800) and the 8-minute
# official session budget is exhausted after ~20 tool calls.  The backend
# sends cache_salt=adapter_sha256, so cached blocks are namespaced per adapter
# version; vLLM 0.32 accepts the field (verified 200 on /v1/completions).
enable_prefix_cache = true
return_token_ids = true
return_logprobs = true
require_runtime_lora = true
require_sleep_mode = true
sleep_level = 2
max_loras = 2
lora_name_prefix = "spo"
control_timeout_seconds = 600

[spo]
target_action_tokens = 16384
max_policy_lag = 2
ppo_epochs = 1
clip_epsilon = 0.2
clip_epsilon_high = 0.28
advantage_epsilon = 0.000001
# All eligible trajectories can train, including negative examples.
value_prior = 0.5
success_prior = 0.5
prior_strength = 1.0
kl_half_life = 0.05
sampling_epsilon = 0.05
# Exact-prefix training tree. lcp_greedy keeps the exact per-call occurrences
# but prefers the longest shared prefix within a small lookahead window.
training_prefix_reuse = "tree"
training_prefix_grouping = "lcp_greedy"
training_prefix_lookahead = 8
training_prefix_max_calls = 4
training_prefix_min_tokens = 256
training_prefix_query_chunk_size = 256
# "none" exists only for a measured memory-safe pilot; keep full checkpointing
# until the A800 profile shows activation memory headroom.
training_tree_checkpoint_policy = "all"
profile_training_timing = true

[optimizer]
type = "fused_adamw"
learning_rate = 0.000005
max_grad_norm = 1.0
gradient_checkpointing = true

[rewards]
objective_version = "official_differential_spo_v3"
success_efficiency_weight = 0.05

[adapter]
double_buffer = true
allow_resident_pair = false

[data]
task_ids = ["fastapi_14258", "requests_7205", "requests_7315", "rich_3782", "rich_4070", "rich_4076"]
exclude_task_ids = []

[runtime]
python = "/opt/gemma-runtime/bin/python"
sandbox_baseline_python = "/opt/gemma-sandbox-baseline/bin/python"
# Test-only public wheels absent from the official cache (inline-snapshot,
# dirty-equals, attrs). Copied into each task's sandbox wheel directory; the
# official wheel cache and source directory are never modified.
extra_wheels = "/root/autodl-tmp/gemma4/wheels-extra"
sandbox = "subprocess"
sandbox_root = "/root/autodl-tmp/gemma4/sandboxes"
port = 0
session_clock = "queue_excluded"
event_summarizer = "official"
queue_timing_poll_seconds = 0.2

[runtime.evaluation]
timeout_seconds = 300
verification_timeout_seconds = 300
max_tool_calls = 28
max_time_minutes = 8.0
max_turns = 50

[sampling]
temperature = 1.0
top_p = 1.0
top_k = 0
# Native vLLM max_tokens per request (stock default 16 would silently truncate
# rollouts). Matches the harness max_output_tokens generation constraint.
max_new_tokens = 16384
