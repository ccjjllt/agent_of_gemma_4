# Single-factor research candidate; all other recipe values are preserved.

[policy]
model_name = "google/gemma-4-31B-it-qat-q4_0-unquantized"
model_revision = "1e4d8beecacb8b7590c1d8bedd7335f687bf311f"
model_source_uri = "https://huggingface.co/google/gemma-4-31B-it-qat-q4_0-unquantized/tree/1e4d8beecacb8b7590c1d8bedd7335f687bf311f"
response_parser = "official_vllm_gemma4_0_19_1"
max_context = 32768
device_map = "balanced"
lora_rank = 128
lora_alpha = 256
lora_dropout = 0.0
adapter_export_dtype = "bfloat16"
logprob_chunk_size = 64
seed = 3407

[run]
num_generations = 8
groups_per_batch = 1
max_batches = 1
max_candidate_groups_per_batch = 12
learning_rate = 5e-06
max_grad_norm = 1.0
walltime_seconds = 7200
max_cpu_workers = 8
prefetch_groups = 2
max_worker_retries = 1
max_failed_groups_per_session = 3

[generation]
max_batch_size = 4
max_batch_tokens = 131072
batch_wait_ms = 5
prefill_chunk_tokens = 512
max_prefill_tokens_per_step = 1024
kv_capacity_increment = 256
sliding_cache_enabled = true
prefix_cache_entries = 8
prefix_cache_memory_fraction = 0.15
prefix_cache_safety_bytes = 2147483648

[generation.profiling]
enabled = false
wait_steps = 16
warmup_steps = 2
active_steps = 8
repeat = 1

[data]
task_ids = []
exclude_task_ids = []

[grpo]
num_iterations = 2
epsilon = 0.2
epsilon_high = 0.28
beta = 0.01
loss_type = "dr_grpo"
max_completion_length = 32768
scale_rewards = "group"
advantage_std_floor = 0.05
importance_sampling_cap = 2.0
probability_correction_version = "decoupled_token_tis_v1"
target_kl = 0.05
post_update_kl_max_calls = 4
reference_cache_max_entries = 128
reference_cache_max_tokens = 1000000
share_zero_reference = true
warmup_ratio = 0.1
lr_schedule_version = "positive_warmup_linear_v1"
lr_scheduler_type = "linear"
scheduler_total_steps = 2
training_prefix_reuse = "tree"
training_prefix_version = "exact_token_tree_v1"
training_prefix_max_calls = 4
training_prefix_max_tokens = 32768
training_prefix_mask_bytes = 536870912
training_prefix_min_tokens = 256
warmup_steps = 1

[curriculum]
uniform_mix = 0.2
coverage_mix = 0.3
ema_decay = 0.8
min_group_std = 0.0001
variance_scale = 0.05
variance_weight = 1.0
success_weight = 1.0
novelty_weight = 0.2
priority_floor = 0.05
repo_repeat_penalty = 0.5

[rewards]
resolved_weight = 1.0
repair_weight = 0.3
regression_weight = 0.5
efficiency_weight = 0.02
repetition_weight = 0.0
success_token_budget = 65536

[runtime]
python = "/opt/gemma-runtime/bin/python"
sandbox_baseline_python = "/opt/gemma-sandbox-baseline/bin/python"
sandbox = "subprocess"
sandbox_root = "/root/autodl-tmp/gemma4/sandboxes"
port = 0
session_clock = "queue_excluded"
event_summarizer = "official"
queue_timing_poll_seconds = 0.2

[runtime.evaluation]
timeout_seconds = 300
verification_timeout_seconds = 300
max_tool_calls = 100
max_time_minutes = 60.0
max_turns = 50

[sampling]
temperature = 1.0
top_p = 1.0
top_k = 0
