# Candidate for torchrun --standalone --nproc-per-node=4 -m training.train_ddp.
# Each GPU stores its own NF4 base. Actual sequence capacity must be measured.
base_family: gemma-4-31b-it-qat-q4_0-unquantized
source_version_note: Kaggle Transformers version 2
local_files_only: true
allow_cached_nf4: true
quant_backend: nf4
compute_dtype: bfloat16
device: cuda
kbit_prepare: norms_fp32
loss_backend: selected_chunked
loss_chunk_size: 32
rank: 8
alpha: 16
learning_rate: 0.00005
max_sequence_length: 1024
micro_batch_size: 1
gradient_accumulation_steps: 2
gradient_checkpointing: true
epochs: 1
checkpoint_every_n_steps: 100
max_steps: 0
seed: 0
