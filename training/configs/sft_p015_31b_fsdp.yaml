# Experimental: torchrun --standalone --nproc-per-node=4 -m training.train_fsdp.
# Supply immutable cache/tokenizer/tools/template/data paths explicitly.
# Default 6032 is conservative; P015 real FSDP capacity run updated a 6846-token transaction.
# That capacity evidence does not establish autonomous repair or CT deployment gains.
base_family: gemma-4-31b-it-qat-q4_0-unquantized
source_version_note: Official Kaggle QAT-unquantized v2 -> existing NF4 cache
local_files_only: true
allow_cached_nf4: true
quant_backend: nf4
compute_dtype: bfloat16
device: cuda
kbit_prepare: norms_fp32
loss_backend: selected_chunked
loss_chunk_size: 32
rank: 8
alpha: 16
dropout: 0.0
learning_rate: 0.00002
max_sequence_length: 6032
micro_batch_size: 1
gradient_accumulation_steps: 2
gradient_checkpointing: true
epochs: 1
checkpoint_every_n_steps: 2
max_steps: 0
seed: 15022
