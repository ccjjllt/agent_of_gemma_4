# P005 sampling: same 16384 output ceiling as the P002 frozen base, so the
# state/handoff increment is isolated (same isolation logic as the T2 panel).
# New thinking semantics (verified in adk_submission 0.2.13
# resolvers/generation.py:359-453): a POSITIVE thinking_budget is forwarded as
# extra_body.thinking_token_budget (real token budget, not just an on/off
# switch); 0 (or level none) disables thinking; include_thoughts:false strips
# thought parts from history AND outgoing reasoning -- closing thinking and
# not retaining thoughts are different interventions, study them separately.
# 1024/4096 below are experiment STARTING points under the new semantics, not
# known optima. Output ceiling stays 16384 to separate the budget variable.
temperature: 0.2
top_p: 0.95
max_output_tokens: 16384
thinking_config:
  thinking_budget: 4096
  include_thoughts: true
