# P005 sampling (shared): same total budget as single_state -- the handoff
# comparison must not confound context handling with more tools or more time.
# Both sub-agents include this file; explorer and executor do NOT get separate
# extra budgets. Soft time split (explore ~1/3, execute the rest) is a prompt
# goal only, not a host-enforced quota (see prompts/explorer.md).
# Thinking semantics: as in single_state (adk_submission 0.2.13 forwards a
# positive thinking_budget to thinking_token_budget; 0 disables). First compare
# handoff with THIS shared sampling; only afterwards study split variants such
# as explore-4096 / mechanical-execute-1024 as separate, singly-changed configs.
temperature: 0.2
top_p: 0.95
max_output_tokens: 16384
thinking_config:
  thinking_budget: 4096
  include_thoughts: true
