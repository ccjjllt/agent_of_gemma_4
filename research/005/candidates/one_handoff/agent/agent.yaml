name: p005_one_handoff
agent_class: SequentialAgent
description: P005 one-shot research-to-execution handoff. Explorer builds handoff.json and passes its handle via output_key repair_context; executor starts fresh (include_contents none) and reads the handle first. Same tools and same total budget as single_state.
sub_agents:
  - config_path: explorer.yaml
  - config_path: executor.yaml
